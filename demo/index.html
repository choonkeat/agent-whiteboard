<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Whiteboard Demo</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
  <div class="container">
    <h1>Agent Whiteboard</h1>
    <p class="subtitle">Turtle-graphics-inspired animated whiteboard with hand-drawn aesthetics</p>

    <div class="toolbar">
      <button id="btn-architecture">Draw Architecture</button>
      <button id="btn-flowchart">Draw Flowchart</button>
      <button id="btn-spiral">Turtle Spiral</button>
      <button id="btn-clear">Clear</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="whiteboard" width="900" height="600"></canvas>
    </div>

    <div class="json-section">
      <h3>Custom Instructions (JSON)</h3>
      <textarea id="json-input" rows="8" placeholder='[{"type":"drawRect","x":100,"y":100,"width":200,"height":120},{"type":"writeText","text":"Hello!","x":130,"y":140}]'></textarea>
      <button id="btn-run-json">Run Instructions</button>
    </div>

    <div class="status" id="status">Ready</div>
  </div>

  <script type="module" src="demo.ts"></script>
</body>
</html>
